<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Explore Catalog - Dev Viewer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            height: 100vh;
        }

        :root {
            --outer-space: 1.5rem;
        }

        main {
            font-family: Raleway, "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 16px;

            flex: 1;
            padding: 2rem;
            background: #ffffff;
            overflow-y: auto;
        }

        aside {
            width: 280px;
            background: #f4f4f5;
            border-right: 1px solid #e4e4e7;
            padding: 1rem;
            overflow-y: auto;

            & h2 {
                font-size: 1.1rem;
                margin-top: 0;
                color: #27272a;
            }

            & ul {
                list-style: none;
                padding: 0;
                margin: 0;
            }

            & li {
                margin-bottom: 0.5rem;
            }

            & a {
                display: block;
                padding: 0.5rem 0.75rem;
                color: #3f3f46;
                text-decoration: none;
                border-radius: 6px;
                font-size: 0.9rem;

                &:hover {
                    background: #e4e4e7;
                }

                &.active {
                    background: #2563eb;
                    color: #ffffff;
                    font-weight: 500;
                }

                & small {
                    display: block;
                    opacity: 0.6;
                    font-size: 0.75rem;
                }
            }
        }
    </style>
    <style>
        /* web components states */
        :where(:not(:defined)) {
            --bg-color: #ccc;
            --stripes: var(--bg-color);

            --color-bg-dark: #999;
            --bg: repeating-linear-gradient(45deg, var(--stripes) 0px, var(--stripes) 10px, transparent 10px, transparent 20px);

            display: inline-block;
            vertical-align: middle;
            position: relative;

            overflow: hidden;
            isolation: isolate;
            contain: layout;

            background-image: var(--bg);
            background-position: 0 0;

            min-height: 1lh;
            min-width: 100%;
            height: auto;
            width: 100%;

            padding: 0.35em;
            border-radius: 0.5rem;

            /* Loading states */
            &[ce="loading"] {
                opacity: 0.8;
                cursor: wait;

                &::after {
                    pointer-events: none;
                    content: " ";
                    position: absolute;
                    inset: 0;

                    transform: translateX(-100%);
                    width: 100%;

                    background: linear-gradient(to right, transparent 10%, var(--color-bg-dark) 50%, transparent 90%);
                    will-change: transform;
                    animation: shimmer 2.5s ease-in-out infinite;
                }
            }

            &[ce="error"] {
                padding: 0.25em 0.5em;
                outline: 2px dashed red;
                outline-offset: -2px;

                --bg-color: transparent;
                background-color: indianred;
                color: white;

                &::before {
                    font-family: monospace;
                    content: attr(error);
                }

                /** Disable nested components */
                &> :not(:defined) {
                    display: none;
                }
            }

            /** This state is an error */
            &[ce="defined"] {
                outline: 2px dashed red;
                --bg-color: transparent;
                background-color: indianred;
                color: white;

                &::before {
                    font-family: monospace;
                    content: "Error: tag name is probably wrong!";
                }
            }
        }

        [ce="defined"] {
            opacity: 1;
        }

        /* Shimmer/skeleton */
        @keyframes shimmer {
            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(100%);
            }
        }
    </style>
</head>

<body>
    <aside>
        <h2>Explore Pages</h2>
        <ul id="route-list"></ul>

        <h2>Explore Components</h2>
        <ul id="component-list"></ul>
    </aside>

    <main id="stage">
        <!-- Active page/component renders here -->
    </main>

    <!-- Vite imports the dev runner -->
    <script type="module">
        import CEAutoLoader from "ce-autoloader"
        import catalog from "/catalog.ts";
        import { createRouter } from "/router.ts";
        import routes from "/routes.ts";

        const components = Object.keys(catalog);
        const registry = new CEAutoLoader({ catalog });

        /**
         * Playground only route, previews a single component of the team.
         * It lives here (and not on the team route table) because it's a dev
         * tool, never an app page.
         */
        const preview = {
            name: "component-preview",
            path: "/components/:tag",
            render: ({ tag }) => `<${tag}></${tag}>`,
        };

        const notFound = {
            name: "not-found",
            path: "*",
            render: () => `<h1>404 Not Found</h1>`
        };

        const router = createRouter([...routes, preview], { notFound });

        /** Custom elements referenced by the given html */
        function tagsIn(html) {
            return [...new Set([...html.matchAll(/<([a-z][a-z0-9]*-[a-z0-9-]*)[\s/>]/g)].map(([, tag]) => tag))];
        }

        function init() {
            const routeList = document.getElementById("route-list");
            const componentList = document.getElementById("component-list");
            const stage = document.getElementById("stage");

            if (!routeList || !componentList || !stage) return;

            // Team routes, with their readable path (like the shell app)
            routeList.innerHTML = routes
                .map(({ name, path }) => `<li><a href="${path}" data-navigo data-route="${name}">${name}<small>${path}</small></a></li>`)
                .join("");

            // Every catalog entry can be previewed on its own
            componentList.innerHTML = components
                .map((tag) => `<li><a href="/components/${tag}" data-navigo data-tag="${tag}">${tag}</a></li>`)
                .join("");

            const links = [...routeList.querySelectorAll("a"), ...componentList.querySelectorAll("a")];

            function renderRoute() {
                // URL: http://localhost:4001/products/classic -> render callback of "products-by-category"
                const result = router.render(window.location.pathname);
                const match = result?.match;
                const previewTag = match?.name === preview.name ? match.params.tag : null;

                // Highlight the active route (or the previewed component)
                links.forEach((link) => {
                    const active = previewTag
                        ? link.dataset.tag === previewTag
                        : link.dataset.route === match?.name;

                    link.classList.toggle("active", active);
                });

                // Preload the page custom-element, then render the route html
                registry.preload((result ? tagsIn(result.html) : []).filter((tag) => tag in catalog));
                stage.innerHTML = result?.html ?? "";
            }

            // Intercept app links (data-navigo), navigating client-side like the shell app
            document.addEventListener("click", (event) => {
                const link = event.target instanceof Element && event.target.closest("a[data-navigo]");
                if (!link) return;

                const url = new URL(link.getAttribute("href"), window.location.href);
                if (url.origin !== window.location.origin) return;

                event.preventDefault();
                window.history.pushState({}, "", url);
                window.scrollTo({ top: 0, behavior: "smooth" });
                renderRoute();
            });

            // Handle click & route changes
            window.addEventListener("popstate", renderRoute);
            renderRoute();
        }

        // Initialize when DOM is ready
        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", init);
        } else {
            init();
        }
    </script>
</body>

</html>
